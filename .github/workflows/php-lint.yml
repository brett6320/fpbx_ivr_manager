name: php-lint

# Syntax-check the FusionPBX PHP app across the PHP range it must run under:
# 7.0 is the floor for FusionPBX 4.x hosts; 8.3 covers current 5.x.
on:
  push:
    paths:
      - 'fusionpbx-app/**'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'fusionpbx-app/**'
      - '.github/workflows/php-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.0', '7.3', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: php -l all files
        run: |
          set -e
          find fusionpbx-app -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

<script>
// WebAuthn base64url <-> ArrayBuffer helpers
function b64urlToBuf(s){s=s.replace(/-/g,'+').replace(/_/g,'/');const p='='.repeat((4-s.length%4)%4);const bin=atob(s+p);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a.buffer;}
function bufToB64url(buf){let bin='';const b=new Uint8Array(buf);for(const x of b)bin+=String.fromCharCode(x);return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}

async function passkeyRegister(){
  try{
    const opts = await (await fetch('{{ base_path }}/auth/mfa/passkey/register-options',{method:'POST'})).json();
    opts.challenge = b64urlToBuf(opts.challenge);
    opts.user.id = b64urlToBuf(opts.user.id);
    (opts.excludeCredentials||[]).forEach(c=>c.id=b64urlToBuf(c.id));
    const cred = await navigator.credentials.create({publicKey:opts});
    const body = {id:cred.id, rawId:bufToB64url(cred.rawId), type:cred.type,
      response:{clientDataJSON:bufToB64url(cred.response.clientDataJSON),
                attestationObject:bufToB64url(cred.response.attestationObject)},
      clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {}};
    const res = await (await fetch('{{ base_path }}/auth/mfa/passkey/register',{method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})).json();
    if(res.ok){location.href=res.redirect;} else {alert(res.error||'registration failed');}
  }catch(e){alert('Passkey error: '+e);}
}

async function passkeyAuth(){
  try{
    const opts = await (await fetch('{{ base_path }}/auth/mfa/passkey/auth-options',{method:'POST'})).json();
    opts.challenge = b64urlToBuf(opts.challenge);
    (opts.allowCredentials||[]).forEach(c=>c.id=b64urlToBuf(c.id));
    const cred = await navigator.credentials.get({publicKey:opts});
    const r = cred.response;
    const body = {id:cred.id, rawId:bufToB64url(cred.rawId), type:cred.type,
      response:{clientDataJSON:bufToB64url(r.clientDataJSON), authenticatorData:bufToB64url(r.authenticatorData),
                signature:bufToB64url(r.signature), userHandle:r.userHandle?bufToB64url(r.userHandle):null},
      clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {}};
    const res = await (await fetch('{{ base_path }}/auth/mfa/passkey/auth',{method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})).json();
    if(res.ok){location.href=res.redirect;} else {alert(res.error||'assertion failed');}
  }catch(e){alert('Passkey error: '+e);}
}
</script>

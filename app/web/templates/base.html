<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FusionPBX IVR Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: .75rem 0 .25rem; font-weight: 600; }
    input, select, textarea { width: 100%; padding: .5rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: .6rem 1.2rem; cursor: pointer; }
    .preview { background: #f3f4f6; border-left: 4px solid #2563eb; padding: 1rem; margin-top: 1rem; }
    .topbar { display: flex; justify-content: space-between; align-items: center; }
    .muted { color: #6b7280; font-size: .9rem; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>

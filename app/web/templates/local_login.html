{% extends "base.html" %}
{% block body %}
<h1>{{ org }} — Local administrator sign-in</h1>
<p class="muted">Break-glass access for local administrators. Requires MFA.</p>

{% if error %}<div class="preview" style="border-color:#dc2626;">{{ error }}</div>{% endif %}

<form method="post" action="/auth/local">
  <label>Username</label>
  <input name="username" autocomplete="username" required autofocus>
  <label>Password</label>
  <input name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
<p class="muted"><a href="/auth/login">← Back to primary sign-in</a></p>
{% endblock %}

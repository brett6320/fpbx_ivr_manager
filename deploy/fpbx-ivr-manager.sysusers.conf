# systemd-sysusers: create the unprivileged service account declaratively.
#
#   sudo cp deploy/fpbx-ivr-manager.sysusers.conf /etc/sysusers.d/fpbx-ivr-manager.conf
#   sudo systemd-sysusers
#
#Type Name    ID   GECOS                        Home          Shell
u     ivrmgr  -    "FusionPBX Closure Manager"  /nonexistent  /usr/sbin/nologin
# Add the service user to the 'freeswitch' group ONLY when using
# FPBX_RECORDING_STORAGE=local (so it can write greeting .wav files). Omit this
# line entirely with FPBX_RECORDING_STORAGE=db.
m     ivrmgr  freeswitch

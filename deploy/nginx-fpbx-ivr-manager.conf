# Reverse proxy for the IVR Manager. TLS terminates here; the app listens
# only on 127.0.0.1:8082. Adjust server_name / cert paths. APP_BASE_URL in the
# app env MUST equal https://<server_name>[/<sub-path>] (drives cookies, links,
# and WebAuthn origin).
#
# To serve under a sub-path instead of the site root, set BASE_PATH=/ivr-manager
# (or APP_BASE_URL=https://<host>/ivr-manager) in the app env and pass the prefix
# through UNCHANGED — the app owns the whole prefix, so do NOT strip it:
#     location /ivr-manager/ { proxy_pass http://127.0.0.1:8082; ... }

server {
    listen 443 ssl;
    http2 on;
    server_name ivr.example.com;

    ssl_certificate     /etc/ssl/certs/ivr.example.com.crt;
    ssl_certificate_key /etc/ssl/private/ivr.example.com.key;

    # Security headers (WebAuthn/passkeys require a secure context).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name ivr.example.com;
    return 301 https://$host$request_uri;
}

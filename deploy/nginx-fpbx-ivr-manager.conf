# Reverse proxy for the Closure Manager. TLS terminates here; the app listens
# only on 127.0.0.1:8080. Adjust server_name / cert paths. APP_BASE_URL in the
# app env MUST equal https://<server_name> (drives cookies + WebAuthn origin).

server {
    listen 443 ssl;
    http2 on;
    server_name ivr.example.com;

    ssl_certificate     /etc/ssl/certs/ivr.example.com.crt;
    ssl_certificate_key /etc/ssl/private/ivr.example.com.key;

    # Security headers (WebAuthn/passkeys require a secure context).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name ivr.example.com;
    return 301 https://$host$request_uri;
}
